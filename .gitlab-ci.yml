# Idlebound pipeline, derived from devops/docs templates/webapp/.gitlab-ci.yml.
#
# Model:
#   test  -> on develop, on main, and on merge requests
#   build -> on develop and on main, pushes to the GitLab registry
#   deploy_dev  -> manual, from develop     -> https://idlebound-d.kisukesaama.com
#   deploy_prod -> automatic, on every push to main (merge requests only)
#                                           -> https://idlebound.kisukesaama.com
#
# No git tags: the version is the "version" of the root package.json, raised by the change
# that deserves it (AGENTS.md, "Versions and patch notes").
#
# Required GitLab CI/CD variables (scope per environment, protect the production ones):
#   IDLEBOUND_POSTGRES_PASSWORD   required
#   IDLEBOUND_SMTP_URL            optional — smtp(s)://user:pass@host:port for e-mails
#                                 (confirmation, password reset, inactivity warning); without
#                                 it, links are written to the API log, addresses are not
#                                 confirmed and inactive accounts are never purged
#   IDLEBOUND_MAIL_FROM           optional — sender of those e-mails
#   IDLEBOUND_BACKUP_REMOTE       optional — rclone remote, written inline, where the daily
#                                 database dumps are copied off the host (deploy/README.md);
#                                 without it, the dumps stay on the host only
#
# Images are tagged with the branch and with the commit; a deployment runs the commit's.
# rollback_dev / rollback_prod (manual) deploy an earlier commit's images: run them with the
# variable ROLLBACK_SHA set to that commit (deploy/README.md, "Rolling back").

image: docker:29

stages:
  - test
  - build
  - deploy

variables:
  APP_SUBDOMAIN: idlebound
  DOCKER_BUILDKIT: "1"
  DOCKER_HOST: unix:///var/run/docker.sock
  DOCKER_TLS_CERTDIR: ""

# ---------------------------------------------------------------------------
# Shared setup. Do not edit below this line without reading https://gitlab.kisukesaama.com/devops/docs -> pipeline.md.
# ---------------------------------------------------------------------------

.docker_defaults: &docker_defaults
  image: docker:29
  tags:
    - devops
  before_script:
    - set -euo pipefail
    - docker info
    - |
      if [[ -z "${CI_REGISTRY:-}" ]]; then
        echo "CI_REGISTRY is not set." >&2
        exit 1
      fi
    - export CI_REGISTRY_IMAGE="${CI_REGISTRY_IMAGE:-${CI_REGISTRY}/${CI_PROJECT_PATH}}"
    - export IMAGE_TAG="${CI_COMMIT_REF_SLUG}"
    - echo "${CI_REGISTRY_PASSWORD:-${CI_JOB_TOKEN}}" | docker login --username "${CI_REGISTRY_USER:-gitlab-ci-token}" --password-stdin "${CI_REGISTRY}"

.deploy_defaults: &deploy_defaults
  image: docker:29
  tags:
    - devops
  before_script:
    - set -euo pipefail
    - docker info
    - |
      if [[ -z "${CI_REGISTRY:-}" ]]; then
        echo "CI_REGISTRY is not set." >&2
        exit 1
      fi
    - export CI_REGISTRY_IMAGE="${CI_REGISTRY_IMAGE:-${CI_REGISTRY}/${CI_PROJECT_PATH}}"
    # The commit's own images: a later push to the branch never changes what this job deploys,
    # and a rollback names the commit it goes back to.
    - |
      if [[ -n "${ROLLBACK_SHA:-}" ]]; then
        if [[ ! "${ROLLBACK_SHA}" =~ ^[0-9a-f]{40}$ ]]; then
          echo "ROLLBACK_SHA must be a full commit hash (40 lowercase hex characters)." >&2
          exit 1
        fi
        export IMAGE_TAG="${ROLLBACK_SHA}"
      else
        export IMAGE_TAG="${CI_COMMIT_SHA}"
      fi
    - set -a; source deploy/paths.env; set +a
    # main means production; anything else that reaches a deploy job is develop.
    - |
      if [[ "${CI_COMMIT_BRANCH:-}" == "main" ]]; then
        export DEPLOY_ENV=prod
        export APP_HOST="${APP_SUBDOMAIN}.kisukesaama.com"
      else
        export DEPLOY_ENV=dev
        export APP_HOST="${APP_SUBDOMAIN}-d.kisukesaama.com"
      fi
    - export TARGET_DIR="${DEPLOY_DIR}/${DEPLOY_ENV}"
    - export ENV_DATA_DIR="${DATA_DIR}/${DEPLOY_ENV}"
    - |
      validate_paths() {
        case "${DEPLOY_DIR:-}" in
          /home/kisuke/*) ;;
          *) echo "DEPLOY_DIR must stay under /home/kisuke/." >&2; exit 1 ;;
        esac
        case "${DATA_DIR:-}" in
          /home/kisuke/*) ;;
          *) echo "DATA_DIR must stay under /home/kisuke/." >&2; exit 1 ;;
        esac
        case "${DEPLOY_DIR}${DATA_DIR}" in
          *..*) echo "Deployment paths cannot contain '..'." >&2; exit 1 ;;
        esac
      }

      # One `: "${VAR:?...}"` line per required secret, and one line per key written into
      # app.env. A missing variable must fail here, not inside a container.
      write_runtime_files() {
        local target="$1"
        local env_name="${CI_ENVIRONMENT_NAME:-this environment}"
        : "${IDLEBOUND_POSTGRES_PASSWORD:?Set IDLEBOUND_POSTGRES_PASSWORD for ${env_name}}"
        # The password ends up inside a postgres:// URL: reject characters that would break it
        # here, rather than as an API restart loop behind an "unhealthy" healthcheck.
        case "${IDLEBOUND_POSTGRES_PASSWORD}" in
          *[@:/?#%\ ]*) echo "IDLEBOUND_POSTGRES_PASSWORD must not contain @ : / ? # % or spaces." >&2; exit 1 ;;
        esac
        # Only production is indexed by search engines; dev answers noindex.
        local indexable=false
        if [[ "${DEPLOY_ENV}" == "prod" ]]; then indexable=true; fi

        mkdir -p "${target}"
        cp deploy/compose.yml "${target}/compose.yml"
        cp deploy/paths.env "${target}/paths.env"
        cp deploy/backup.sh "${target}/backup.sh"
        # app.env carries credentials, so it is written with a restrictive umask and
        # tightened again on the host below.
        (umask 077; printf '%s\n' \
          "DEPLOY_ENV=${DEPLOY_ENV}" \
          "APP_HOST=${APP_HOST}" \
          "CI_REGISTRY_IMAGE=${CI_REGISTRY_IMAGE}" \
          "IMAGE_TAG=${IMAGE_TAG}" \
          "POSTGRES_DB=${IDLEBOUND_POSTGRES_DB:-idlebound}" \
          "POSTGRES_USER=${IDLEBOUND_POSTGRES_USER:-idlebound}" \
          "POSTGRES_PASSWORD=${IDLEBOUND_POSTGRES_PASSWORD}" \
          "SITE_INDEXABLE=${indexable}" \
          "SMTP_URL=${IDLEBOUND_SMTP_URL:-}" \
          "MAIL_FROM=${IDLEBOUND_MAIL_FROM:-Idlebound <no-reply@kisukesaama.com>}" \
          "BACKUP_REMOTE=${IDLEBOUND_BACKUP_REMOTE:-}" \
          > "${target}/app.env")
      }

      # The runner mounts the host Docker socket but NOT /home/kisuke: files written in this
      # job live in a container that is about to be deleted. Push them onto the host through
      # a throwaway container that does have the mount, or every Compose bind mount below
      # points at a directory that does not exist.
      stage_on_host() {
        local source_dir="$1"
        local target_rel="${TARGET_DIR#/home/kisuke/}"
        local data_rel="${DATA_DIR#/home/kisuke/}"

        tar -C "${source_dir}" -cf - . | docker run --rm -i \
          -e TARGET_REL="${target_rel}" \
          -e DATA_REL="${data_rel}" \
          -e DEPLOY_ENV="${DEPLOY_ENV}" \
          -v /home/kisuke:/host-home \
          alpine:3.24 sh -euc '
            case "$TARGET_REL" in ""|/*|*..*) exit 1 ;; esac
            case "$DATA_REL" in ""|/*|*..*) exit 1 ;; esac
            host_target="/host-home/$TARGET_REL"
            host_data="/host-home/$DATA_REL/$DEPLOY_ENV"
            # One mkdir per bind-mounted data directory in compose.yml.
            mkdir -p "$host_target" "$host_data/postgres" "$host_data/backups"
            tar -C "$host_target" -xf -
            chmod 750 "$host_target" "$host_data" "$host_data/postgres"
            chmod 700 "$host_data/backups"
            chmod 640 "$host_target/compose.yml" "$host_target/paths.env" "$host_target/backup.sh"
            chmod 600 "$host_target/app.env"
            # web and api are read_only and write only to tmpfs: no chown needed.
          '
      }

      validate_paths
      mkdir -p "${TARGET_DIR}" "${ENV_DATA_DIR}/postgres" "${ENV_DATA_DIR}/backups"
      write_runtime_files "${TARGET_DIR}"
      stage_on_host "${TARGET_DIR}"
    - echo "${CI_REGISTRY_PASSWORD:-${CI_JOB_TOKEN}}" | docker login --username "${CI_REGISTRY_USER:-gitlab-ci-token}" --password-stdin "${CI_REGISTRY}"
    - |
      # The off-site copy of the backups runs only when a remote is configured.
      if [[ -n "${IDLEBOUND_BACKUP_REMOTE:-}" ]]; then export COMPOSE_PROFILES=offsite; fi
      compose() {
        docker compose -p "${APP_SUBDOMAIN}-${DEPLOY_ENV}" \
          --env-file paths.env --env-file app.env -f compose.yml "$@"
      }

      # A rollout that fails a health condition reports only "dependency failed to start".
      # The reason is in the container's own log, on a host the runner cannot shell into.
      # Print it here or every failure costs a trip to the server.
      deploy() {
        # A rollback only finds images the registry still keeps.
        compose pull || { echo "Images ${IMAGE_TAG} not found in the registry." >&2; return 1; }
        # A dump before every rollout: the API runs its migrations as it starts, and some
        # drop columns. Skipped on the first deployment, when no database runs yet.
        if [[ -n "$(compose ps --status running -q postgres 2>/dev/null)" ]]; then
          compose run --rm --no-deps backup once predeploy
        fi
        compose up -d --remove-orphans && return 0
        echo "Deployment failed. Container state and recent logs follow." >&2
        compose ps -a >&2 || true
        compose logs --no-color --tail 200 >&2 || true
        return 1
      }

# ---- test -----------------------------------------------------------------
# Game engine tests (balance, anti-cheat, usernames), API integration tests against a real
# Postgres (job service), and a type check of the whole monorepo.

test:
  stage: test
  tags: [devops]
  image: node:24-alpine
  services:
    - name: postgres:17-alpine
      alias: postgres
  variables:
    POSTGRES_DB: idlebound_test
    POSTGRES_USER: idlebound
    POSTGRES_PASSWORD: idlebound
    TEST_DATABASE_URL: postgres://idlebound:idlebound@postgres:5432/idlebound_test
  cache:
    key: idlebound-npm
    paths:
      - .npm
  before_script:
    - npm config set cache "$CI_PROJECT_DIR/.npm"
  script:
    - npm ci --no-audit --no-fund
    - npm audit --audit-level=high
    - npm run lint
    - npm test
  rules:
    - if: '$CI_COMMIT_BRANCH == "develop"'
    - if: '$CI_COMMIT_BRANCH == "main"'
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'

# ---- build ----------------------------------------------------------------

build:
  stage: build
  <<: *docker_defaults
  needs:
    - job: test
      artifacts: false
  script:
    # Monorepo: the build context is the repository root (npm workspaces + shared engine).
    - docker build --pull -t "${CI_REGISTRY_IMAGE}/api:${IMAGE_TAG}" -f apps/api/Dockerfile .
    # The commit names the release: open pages move to it once their game is saved.
    # The version shown in Settings comes from the root package.json, read by the build.
    - docker build --pull --build-arg IDLEBOUND_RELEASE="${CI_COMMIT_SHA}" -t "${CI_REGISTRY_IMAGE}/web:${IMAGE_TAG}" -f apps/web/Dockerfile .
    - docker push "${CI_REGISTRY_IMAGE}/api:${IMAGE_TAG}"
    - docker push "${CI_REGISTRY_IMAGE}/web:${IMAGE_TAG}"
    # The commit's own tag: what the deploy jobs run, and what a rollback goes back to.
    - docker tag "${CI_REGISTRY_IMAGE}/api:${IMAGE_TAG}" "${CI_REGISTRY_IMAGE}/api:${CI_COMMIT_SHA}"
    - docker tag "${CI_REGISTRY_IMAGE}/web:${IMAGE_TAG}" "${CI_REGISTRY_IMAGE}/web:${CI_COMMIT_SHA}"
    - docker push "${CI_REGISTRY_IMAGE}/api:${CI_COMMIT_SHA}"
    - docker push "${CI_REGISTRY_IMAGE}/web:${CI_COMMIT_SHA}"
  rules:
    - if: '$CI_COMMIT_BRANCH == "develop"'
    - if: '$CI_COMMIT_BRANCH == "main"'

# ---- deploy DEV (manual, from develop) ------------------------------------

deploy_dev:
  stage: deploy
  <<: *deploy_defaults
  needs: ["build"]
  resource_group: idlebound-dev
  environment:
    name: dev
    url: https://idlebound-d.kisukesaama.com
    on_stop: stop_dev
  rules:
    - if: '$CI_COMMIT_BRANCH == "develop"'
      when: manual
  script:
    - cd "${TARGET_DIR}"
    - deploy

# Back to an earlier commit's images: run by hand with ROLLBACK_SHA. The database keeps
# the migrations the later release applied; deploy/README.md says when to restore a dump too.
rollback_dev:
  stage: deploy
  <<: *deploy_defaults
  resource_group: idlebound-dev
  environment:
    name: dev
    url: https://idlebound-d.kisukesaama.com
  rules:
    - if: '$CI_COMMIT_BRANCH == "develop"'
      when: manual
  script:
    - '[[ -n "${ROLLBACK_SHA:-}" ]] || { echo "Set ROLLBACK_SHA to the commit to go back to." >&2; exit 1; }'
    - cd "${TARGET_DIR}"
    - deploy

stop_dev:
  stage: deploy
  <<: *deploy_defaults
  resource_group: idlebound-dev
  environment:
    name: dev
    action: stop
  rules:
    - if: '$CI_COMMIT_BRANCH == "develop"'
      when: manual
  script:
    - cd "${TARGET_DIR}"
    - compose down

# ---- deploy PROD (automatic, on main) -------------------------------------

deploy_prod:
  stage: deploy
  <<: *deploy_defaults
  needs: ["build"]
  resource_group: idlebound-prod
  environment:
    name: production
    url: https://idlebound.kisukesaama.com
    on_stop: stop_prod
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
  script:
    - cd "${TARGET_DIR}"
    - deploy

rollback_prod:
  stage: deploy
  <<: *deploy_defaults
  resource_group: idlebound-prod
  environment:
    name: production
    url: https://idlebound.kisukesaama.com
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
      when: manual
  script:
    - '[[ -n "${ROLLBACK_SHA:-}" ]] || { echo "Set ROLLBACK_SHA to the commit to go back to." >&2; exit 1; }'
    - cd "${TARGET_DIR}"
    - deploy

stop_prod:
  stage: deploy
  <<: *deploy_defaults
  resource_group: idlebound-prod
  environment:
    name: production
    action: stop
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
      when: manual
  script:
    - cd "${TARGET_DIR}"
    - compose down
